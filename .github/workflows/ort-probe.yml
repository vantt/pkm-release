name: ort-probe
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: win32-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    env:
      MODEL_COMMIT: 761b726dd34fb83930e26aab4e9ac3899aa1fa78
    steps:
      - uses: actions/checkout@v4
      - name: Model files (pinned commit, sha256 checked against golden/model.json)
        run: |
          M="$RUNNER_TEMP/e5"; mkdir -p "$M/onnx"
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model_quantized.onnx; do
            curl -sfL -o "$M/$f" "https://huggingface.co/Xenova/multilingual-e5-small/resolve/$MODEL_COMMIT/$f"
          done
          node -e '
            const fs=require("fs"),c=require("crypto"),path=require("path");
            const m=JSON.parse(fs.readFileSync("ort-probe/golden/model.json","utf8"));
            for (const f of m.files) {
              const h=c.createHash("sha256").update(fs.readFileSync(path.join(process.argv[1],f.path))).digest("hex");
              if (h!==f.sha256) { console.error("sha256 mismatch", f.path); process.exit(1); }
            }' "$M"
      - name: Build (static ONNX Runtime from pyke's prebuilt binaries)
        working-directory: ort-probe
        run: |
          rustup show active-toolchain
          start=$(date +%s); cargo build --release --locked 2>&1 | tail -20; echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Dependencies of the binary
        working-directory: ort-probe
        run: |
          B=target/release/ort-probe; [ -f "$B.exe" ] && B="$B.exe"
          case "${{ matrix.platform }}" in
            linux-*) ldd "$B" ;;
            darwin-*) otool -L "$B" ;;
            win32-*) "$(cd "$(dirname "$(command -v cl.exe 2>/dev/null || echo /c)")" && pwd)/dumpbin" -dependents "$B" 2>/dev/null || objdump -p "$B" | grep -i "DLL Name" ;;
          esac | tee deps.txt
      - name: Run
        working-directory: ort-probe
        run: |
          B=target/release/ort-probe; [ -f "$B.exe" ] && B="$B.exe"
          "$B" "$RUNNER_TEMP/e5" 1,4 > "result-${{ matrix.platform }}.json"
          node -e '
            const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            r.build_seconds=Number(process.env.build_seconds); r.deps=require("fs").readFileSync("deps.txt","utf8");
            require("fs").writeFileSync(process.argv[1], JSON.stringify(r,null,2));
            console.log(JSON.stringify({bin:r.binary_bytes, golden:r.golden, timing:r.timing}, null, 1));' "result-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ort-probe-${{ matrix.platform }}
          path: ort-probe/result-*.json
