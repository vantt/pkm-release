name: ort-probe
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, variant: static}
          - {os: macos-15, platform: darwin-arm64, variant: static, macos_target: "13.4"}
          - {os: windows-2025, platform: win32-x64, variant: static-crt-static}
          - {os: windows-2025, platform: win32-x64, variant: static-crt-dynamic, rustflags: "-C target-feature=-crt-static"}
          - {os: windows-2025, platform: win32-x64, variant: dynamic, ort: v1.32.0, ort_asset: onnxruntime-win-x64-1.32.0.zip}
          - {os: macos-15-intel, platform: darwin-x64, variant: static}
          - {os: macos-15-intel, platform: darwin-x64, variant: dynamic, ort: v1.22.0, ort_asset: onnxruntime-osx-x86_64-1.22.0.tgz}
          - {os: macos-15, platform: darwin-arm64, variant: dynamic, ort: v1.32.0, ort_asset: onnxruntime-osx-arm64-1.32.0.tgz}
    runs-on: ${{ matrix.os }}
    env:
      MODEL_COMMIT: 761b726dd34fb83930e26aab4e9ac3899aa1fa78
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ matrix.platform }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Model files (pinned commit, sha256 checked against golden/model.json)
        run: |
          M="$RUNNER_TEMP/e5"; mkdir -p "$M/onnx"
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model_quantized.onnx; do
            curl -sfL -o "$M/$f" "https://huggingface.co/Xenova/multilingual-e5-small/resolve/$MODEL_COMMIT/$f"
          done
          node -e '
            const fs=require("fs"),c=require("crypto"),path=require("path");
            const m=JSON.parse(fs.readFileSync("ort-probe/golden/model.json","utf8"));
            for (const f of m.files) {
              const h=c.createHash("sha256").update(fs.readFileSync(path.join(process.argv[1],f.path))).digest("hex");
              if (h!==f.sha256) { console.error("sha256 mismatch", f.path); process.exit(1); }
            }' "$M"
      - name: ONNX Runtime release (dynamic variant)
        if: matrix.ort
        run: |
          gh release download "${{ matrix.ort }}" -R microsoft/onnxruntime -p "${{ matrix.ort_asset }}" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          case "${{ matrix.ort_asset }}" in *.zip) unzip -q "${{ matrix.ort_asset }}" ;; *) tar xzf "${{ matrix.ort_asset }}" ;; esac
          D="$RUNNER_TEMP/${{ matrix.ort_asset }}"; D="${D%.zip}"; D="${D%.tgz}"
          L=""; for f in "$D"/lib/onnxruntime.dll "$D"/lib/libonnxruntime.dylib; do [ -f "$f" ] && L="$f"; done
          test -n "$L"
          echo "ORT_DYLIB_PATH=$L" >> "$GITHUB_ENV"; ls -la "$D/lib"
      - name: Build
        working-directory: ort-probe
        run: |
          if [ -n "${{ matrix.rustflags }}" ]; then export RUSTFLAGS="${{ matrix.rustflags }}"; fi
          if [ -n "${{ matrix.macos_target }}" ]; then export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_target }}"; fi
          F="--features static"; [ "${{ matrix.variant }}" = dynamic ] && F="--features dynamic"
          start=$(date +%s); cargo build --release --locked --no-default-features $F 2>&1 | tail -15
          echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Dependencies
        working-directory: ort-probe
        run: |
          B=target/release/ort-probe; [ -f "$B.exe" ] && B="$B.exe"
          deps() {
            case "${{ matrix.platform }}" in
              linux-*) ldd "$1" ;;
              darwin-*) otool -L "$1" ;;
              win32-*) D=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe -path '*Hostx64/x64*' 2>/dev/null | head -1); "$D" -nologo -dependents "$1" ;;
            esac
          }
          { echo "== $B"; deps "$B"; if [ -n "$ORT_DYLIB_PATH" ]; then echo "== $ORT_DYLIB_PATH"; deps "$ORT_DYLIB_PATH"; ls -la "$ORT_DYLIB_PATH"; fi; } | tee deps.txt
      - name: Run
        working-directory: ort-probe
        run: |
          B=target/release/ort-probe; [ -f "$B.exe" ] && B="$B.exe"
          "$B" "$RUNNER_TEMP/e5" 1,4 > "result-$NAME.json"
          node -e '
            const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            r.variant=process.env.NAME; r.build_seconds=Number(process.env.build_seconds); r.deps=fs.readFileSync("deps.txt","utf8");
            if (process.env.ORT_DYLIB_PATH) r.ort_dylib_bytes=fs.statSync(process.env.ORT_DYLIB_PATH).size;
            fs.writeFileSync(process.argv[1], JSON.stringify(r,null,2));
            console.log(JSON.stringify({bin:r.binary_bytes, dylib:r.ort_dylib_bytes, golden:r.golden, timing:r.timing}, null, 1));' "result-$NAME.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ort-probe-${{ env.NAME }}
          path: |
            ort-probe/result-*.json
            ort-probe/deps.txt
