name: ort-build-win
# Build ONNX Runtime from source on Windows with the static CRT (/MT) and link it statically into ort-probe, which
# keeps the static CRT of pkm.exe. ort 2.0.0-rc.15 pairs with ONNX Runtime 1.31.
on:
  workflow_dispatch:
    inputs:
      ort_tag:
        default: v1.31.1
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    # build.bat của ORT mặc định sinh dự án Visual Studio 17 2022: runner windows-2022 có sẵn bản đó.
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      MODEL_COMMIT: 761b726dd34fb83930e26aab4e9ac3899aa1fa78
    steps:
      - uses: actions/checkout@v4
      - name: ONNX Runtime source
        run: |
          git clone -q --depth 1 --branch "${{ inputs.ort_tag }}" https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          git -C "$RUNNER_TEMP/onnxruntime" rev-parse HEAD | tee ort-commit.txt
      # Bản dựng mất khoảng 45 phút: giữ thư viện đã dựng theo tag và cờ dựng.
      - uses: actions/cache/restore@v4
        id: ortcache
        with:
          path: ${{ runner.temp }}/onnxruntime/build/Windows/Release
          key: ort-win-mt-${{ inputs.ort_tag }}-v2
      - name: Build ONNX Runtime (Release, static CRT, no tests)
        if: steps.ortcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP/onnxruntime"
          $start = Get-Date
          .\build.bat --config Release --parallel --skip_tests --enable_msvc_static_runtime `
            --compile_no_warning_as_error --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_TELEMETRY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chỉ dựng thư viện tĩnh thì CMake không dựng các dependency phải link sau (re2): dựng riêng.
          cmake --build build\Windows\Release --config Release --target re2 -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ort_build_minutes=$([int]((Get-Date) - $start).TotalMinutes)" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem build\Windows\Release\Release\*.lib | Select-Object Name, Length | Format-Table
      # Lưu ngay sau khi dựng (không chờ cả job xanh), để lần sau không dựng lại khi bước link còn hỏng.
      - uses: actions/cache/save@v4
        if: steps.ortcache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/onnxruntime/build/Windows/Release
          key: ort-win-mt-${{ inputs.ort_tag }}-v2
      - name: Static libraries produced
        run: |
          cd "$RUNNER_TEMP/onnxruntime/build/Windows/Release"
          find . -name '*.lib' -printf '%s %p\n' | sort -k2 | tee "$GITHUB_WORKSPACE/ort-libs.txt" | grep -iE 're2|onnxruntime_common|cpuinfo|nsync|protobuf|onnx\.lib|onnx_proto' || true
          echo "libs: $(wc -l < "$GITHUB_WORKSPACE/ort-libs.txt")"
      # Gộp mọi thư viện tĩnh cần cho ORT thành một onnxruntime.lib (cách bản dựng sẵn của pyke đóng gói): ort-sys thấy
      # file đơn thì chỉ link nó, không phải dò tên và chỗ từng thư viện (đặt tên `lib…`, `model_package/` khác chỗ nó tìm).
      - name: Combine into one onnxruntime.lib
        shell: pwsh
        run: |
          $B = "$env:RUNNER_TEMP\onnxruntime\build\Windows\Release"
          $out = "$env:RUNNER_TEMP\ort-lib"; New-Item -ItemType Directory -Force $out | Out-Null
          $libs = Get-ChildItem -Recurse $B -Filter *.lib | Where-Object {
            $_.Name -notmatch '^(libprotobuf|libprotoc|libupb|mat|sqlite3_bundled|zlib_bundled|gtest|gmock|onnx_test|onnxruntime_providers_shared|.*test.*)\.lib$'
          } | ForEach-Object { $_.FullName }
          $libs | Out-File "$env:GITHUB_WORKSPACE\ort-combined.txt"
          if (-not ($libs | Where-Object { $_ -match '\\re2\.lib$' })) { Write-Error "không có re2.lib"; exit 1 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $libexe = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter lib.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          & $libexe.FullName /nologo /IGNORE:4006 /IGNORE:4221 "/OUT:$out\onnxruntime.lib" $libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "$out\onnxruntime.lib" | Select-Object Name, Length
      - name: Model files
        run: |
          M="$RUNNER_TEMP/e5"; mkdir -p "$M/onnx"
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model_quantized.onnx; do
            curl -sfL -o "$M/$f" "https://huggingface.co/Xenova/multilingual-e5-small/resolve/$MODEL_COMMIT/$f"
          done
      - name: Build ort-probe against it (static CRT from .cargo/config.toml)
        working-directory: ort-probe
        run: |
          export ORT_LIB_LOCATION="$RUNNER_TEMP/ort-lib"
          cargo build --release --locked --no-default-features --features system 2>&1 | tail -20
      - name: Dependencies and run
        working-directory: ort-probe
        run: |
          D=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe -path '*Hostx64/x64*' 2>/dev/null | head -1)
          "$D" -nologo -dependents target/release/ort-probe.exe | tee deps.txt
          target/release/ort-probe.exe "$RUNNER_TEMP/e5" 1,4 > result-win32-x64-static-crt-static-source.json
          node -e '
            const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            r.variant="win32-x64-static-crt-static-source"; r.deps=fs.readFileSync("deps.txt","utf8");
            r.ort_build_minutes=Number(process.env.ort_build_minutes); r.ort_commit=fs.readFileSync("../ort-commit.txt","utf8").trim();
            fs.writeFileSync(process.argv[1], JSON.stringify(r,null,2));
            console.log(JSON.stringify({bin:r.binary_bytes, golden:r.golden, timing:r.timing, minutes:r.ort_build_minutes}, null, 1));' \
            result-win32-x64-static-crt-static-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ort-build-win
          path: |
            ort-probe/result-*.json
            ort-probe/deps.txt
            ort-libs.txt
            ort-combined.txt
