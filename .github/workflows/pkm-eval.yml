name: pkm-eval
# Cổng G4 của pkm (eval tìm kiếm so với mốc OHS cùng nền tảng) trên macOS arm64 và Windows x64. Mã pkm không nằm ở repo
# này: job checkout repo private lúc chạy bằng token chỉ đọc (secret PKM_READ_TOKEN), dựng `search-eval` với đầu ra ghi
# vào file (log của repo công khai không in mã), và chỉ tải lên kết quả eval, không tải binary hay thư mục dựng.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: tag or commit of vantt/pkm
        default: v0.3.0
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      OHS_COMMIT: 294902225b903113ff089bf63af5c8aa1fc8a50d
      MODEL_COMMIT: 761b726dd34fb83930e26aab4e9ac3899aa1fa78
      ORT_TAG: v1.31.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vantt/pkm
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PKM_READ_TOKEN }}
          path: pkm-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corpora (OHS source, fixture, obsidian-help)
        run: |
          git config --global core.autocrlf false
          git init -q "$RUNNER_TEMP/ohs"
          git -C "$RUNNER_TEMP/ohs" fetch -q --depth 1 https://github.com/vantt/obsidian-hybrid-search.git "$OHS_COMMIT"
          git -C "$RUNNER_TEMP/ohs" checkout -q --detach FETCH_HEAD
          git clone -q https://github.com/vantt/obsidian-test-fixture "$RUNNER_TEMP/otf"
          git -C "$RUNNER_TEMP/otf" checkout -q v0.12.0
          node ohs-golden/eval/corpora.mjs --ohs-repo "$RUNNER_TEMP/ohs" --otf "$RUNNER_TEMP/otf" --out "$RUNNER_TEMP/corpora"
      - name: Model files
        run: |
          M="$RUNNER_TEMP/models/Xenova--multilingual-e5-small@$MODEL_COMMIT"; mkdir -p "$M/onnx"
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model_quantized.onnx; do
            curl -sfL -o "$M/$f" "https://huggingface.co/Xenova/multilingual-e5-small/resolve/$MODEL_COMMIT/$f"
          done
      # Windows: ONNX Runtime tự dựng với CRT tĩnh, lấy từ cache của ort-build-win (cùng repo, cùng khoá).
      - uses: ./.github/actions/ort-win
        if: runner.os == 'Windows'
      # Đầu ra của cargo ghi vào file ngoài workspace: không in mã ra log công khai. Lỗi thì chỉ in dòng `error…:`.
      - name: Build search-eval
        working-directory: pkm-src
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.4
            export RUSTFLAGS="-C link-arg=$(xcrun clang --print-file-name=lib/darwin/libclang_rt.osx.a)"
          fi
          if ! cargo build --release --locked -p pkm-search-eval --features run > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E '^error' "$RUNNER_TEMP/build.log" | cut -c1-200 | head -20
            exit 1
          fi
          echo "built"
      - name: Run G4 corpora
        working-directory: pkm-src
        run: |
          B="tools/parity/golden/ohs/eval/${{ matrix.platform }}"
          E=target/release/search-eval; [ "$RUNNER_OS" = Windows ] && E="$E.exe"
          mkdir -p "$GITHUB_WORKSPACE/out/run" "$RUNNER_TEMP/work"
          for c in vi-search smoke obsidian-help de; do
            vault=$(node -e 'const j=require(process.argv[1]);process.stdout.write(j[process.argv[2]].vault)' "$RUNNER_TEMP/corpora/corpora.json" "$c")
            pack=$(node -e 'const j=require(process.argv[1]);process.stdout.write(j[process.argv[2]].pack)' "$RUNNER_TEMP/corpora/corpora.json" "$c")
            for mode in hybrid fulltext; do
              base="$B"; [ "$mode" = fulltext ] && base="$B/fulltext"
              if [ ! -f "$base/$c/per-query.jsonl" ]; then echo "$c $mode: không có mốc, bỏ qua"; continue; fi
              "$E" run --corpus "$c" --vault "$vault" --pack "$pack" --baseline "$B" \
                --model-root "$RUNNER_TEMP/models" --out "$GITHUB_WORKSPACE/out/run" --work "$RUNNER_TEMP/work" --mode "$mode"
            done
          done
      # Vector của model int8 lệch theo CPU: ghi CPU của runner để đọc lệch so với mốc (mốc ghi CPU ở run.json).
      - name: Runner CPU
        run: |
          case "$RUNNER_OS" in
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string) ;;
            Windows) cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name") ;;
            *) cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) ;;
          esac
          echo "$cpu" | tee "$GITHUB_WORKSPACE/out/cpu.txt"
      - name: Compare with the OHS baseline
        working-directory: pkm-src
        run: |
          E=target/release/search-eval; [ "$RUNNER_OS" = Windows ] && E="$E.exe"
          set +e
          "$E" compare --baseline "tools/parity/golden/ohs/eval/${{ matrix.platform }}" --run "$GITHUB_WORKSPACE/out/run" \
            --strict --json "$GITHUB_WORKSPACE/out/compare.json" --md "$GITHUB_WORKSPACE/out/compare.md"
          code=$?
          echo "compare exit $code" | tee "$GITHUB_WORKSPACE/out/compare.exit"
          grep -E '^\| ' "$GITHUB_WORKSPACE/out/compare.md" | head -40
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkm-eval-${{ matrix.platform }}
          path: out
