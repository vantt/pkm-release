name: ort-win-lib-release
# Publishes the static-CRT onnxruntime.lib (win-x64, /MT) that ort-win-cached combines from the cached ort-build-win tree,
# as a release asset, so other repos (vantt/momentell) can link ONNX Runtime with +crt-static without this repo's cache.
# Actions caches are per repository and evicted after 7 days unused; a release asset is neither.
# Consumers pin the sha256 printed in the release notes and set ORT_LIB_LOCATION to the unzipped folder.
on:
  workflow_dispatch:
    inputs:
      ort_tag:
        description: ONNX Runtime tag of the cached build tree
        default: v1.31.1
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ort-win-cached
        with:
          ort_tag: ${{ inputs.ort_tag }}
      - name: Package onnxruntime.lib with licenses
        shell: pwsh
        run: |
          $tag = "${{ inputs.ort_tag }}"
          $pkg = "$env:RUNNER_TEMP\pkg\onnxruntime-win-x64-mt-$($tag.TrimStart('v'))"
          New-Item -ItemType Directory -Force "$pkg\licenses" | Out-Null
          Copy-Item "$env:ORT_LIB_LOCATION\onnxruntime.lib" $pkg
          # Third-party sources compiled into the library: carry every license file of the cached _deps trees.
          $deps = "$env:RUNNER_TEMP\onnxruntime\build\Windows\Release\_deps"
          Get-ChildItem $deps -Directory -Filter '*-src' | ForEach-Object {
            $name = $_.Name -replace '-src$', ''
            Get-ChildItem $_.FullName -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)' } |
              ForEach-Object { Copy-Item $_.FullName "$pkg\licenses\$name-$($_.Name)" }
          }
          @"
          MIT License

          Copyright (c) Microsoft Corporation

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          "@ | Out-File -Encoding utf8 "$pkg\licenses\onnxruntime-LICENSE"
          @"
          onnxruntime.lib: ONNX Runtime $tag (https://github.com/microsoft/onnxruntime), CPU, x86_64-pc-windows-msvc,
          static CRT (/MT), every static library of the build combined into one file for ort-sys (ORT_LIB_LOCATION).
          Built by ort-build-win of vantt/pkm-release; re2 compiled with cl /MT by ort-win-cached.
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@ | Out-File -Encoding utf8 "$pkg\README.txt"
          Get-ChildItem -Recurse $pkg | ForEach-Object { $_.FullName }
          $zip = "$env:RUNNER_TEMP\onnxruntime-win-x64-mt-$($tag.TrimStart('v')).zip"
          Compress-Archive -Path $pkg -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $libsha = (Get-FileHash -Algorithm SHA256 "$pkg\onnxruntime.lib").Hash.ToLower()
          "zip $sha $((Get-Item $zip).Length) bytes"
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV
          "ZIP_SHA=$sha" | Out-File -Append $env:GITHUB_ENV
          "LIB_SHA=$libsha" | Out-File -Append $env:GITHUB_ENV
      - name: Publish release ort-win-mt-${{ inputs.ort_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ort-win-mt-${{ inputs.ort_tag }}"
          notes="Static-CRT onnxruntime.lib (win-x64, /MT) for ort-sys ORT_LIB_LOCATION.

          zip sha256: $ZIP_SHA
          onnxruntime.lib sha256: $LIB_SHA
          run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists: not replacing an asset consumers pin by sha256"; exit 1
          fi
          gh release create "$tag" "$ZIP" --title "$tag" --notes "$notes"
